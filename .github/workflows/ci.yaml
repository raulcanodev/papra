name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paqui
          POSTGRES_PASSWORD: paqui
          POSTGRES_DB: paqui_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paqui -d paqui_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i

      # Build only the packages first to properly run the lint and test first to get faster feedback
      - name: Build packages
        run: pnpm -r --parallel -F "./packages/*" build

      - name: Run linters
        run: pnpm -r --parallel lint --quiet

      - name: Type check
        # Exclude docs as their are some typing issues we are ok with for now
        run: pnpm -r --parallel -F "!@paqui/docs" typecheck

      # Production uses the same command before starting the HTTP server. Running
      # it twice here verifies both a clean install and migration idempotency.
      - name: Validate production database migrations
        env:
          DATABASE_URL: postgresql://papra:papra@localhost:5432/papra_ci
        run: |
          pnpm --filter @paqui/app-server migrate:up:prod
          pnpm --filter @paqui/app-server migrate:up:prod

      # Tests are run using vitest projects
      - name: Run tests
        run: |
          pnpm test
          pnpm --filter @paqui/mcp-server test
          pnpm --filter @paqui/mcp test

      # Now build the apps, the longer step, so we do it last as they are more unlikely to fail if the previous steps works
      - name: Build the apps
        run: pnpm -r --parallel -F "./apps/*" build

      - name: Ensure no non-excluded files are changed for the whole repo
        run: git diff --exit-code > /dev/null || (echo "After running the CI, some un-committed changes were detected. Please ensure cleanness before merging." && exit 1)
