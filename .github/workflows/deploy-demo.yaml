name: Deploy demo

# The public demo (demo.heypaqui.com) is the same client built with VITE_IS_DEMO_MODE: every change on main
# reaches it, so it never shows an older app than the real one.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/paqui-client/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-demo.yaml

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the demo
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the demo automatically."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - name: Install pnpm
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm i --frozen-lockfile

      - name: Build the packages the client depends on
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm -r -F "./packages/*" build

      - name: Build the demo
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --filter @paqui/app-client build:demo

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler@4 pages deploy apps/paqui-client/dist-demo --project-name=heypaqui-demo --branch=main --commit-hash=${{ github.sha }}
