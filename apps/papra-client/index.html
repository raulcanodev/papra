    <!-- Prevent FOUC, default to system theme -->
    <script>
      (function () {
        try{
          const stored = localStorage?.getItem('papra_color_mode');
          const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const followsSystem = stored !== 'light' && stored !== 'dark';
          const isLight = stored === 'light' || (followsSystem && !systemPrefersDark);

          document.documentElement.setAttribute('data-kb-theme', isLight ? 'light' : 'dark');
        } catch {}
      })();
    </script>
